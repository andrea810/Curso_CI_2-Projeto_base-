name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.22', '1.23'] 
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB to be ready
      run: sleep 5 

    - name: Test
      run: go test -v ./...
      env: 
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: root
        DB_PORT: "5435" 
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v main.go

  # ✅ CORREÇÃO AQUI: 'docker' está alinhado com 'test' e 'build'
  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets:
      name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.22', '1.23'] 
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB to be ready
      run: sleep 5 

    - name: Test
      run: go test -v ./...
      env: 
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: root
        DB_PORT: "5435" 
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v main.go

  # ✅ CORREÇÃO AQUI: 'docker' está alinhado com 'test' e 'build'
  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets:
      # Passando os secrets para o workflow reutilizável (Docker.yml)
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.PASSWORD_DOCKER_HUB }}
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
   
