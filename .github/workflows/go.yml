name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.22', '1.23'] # Versões mais atuais e estáveis
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB to be ready
      # Opcional, mas recomendado: dá um tempo para o Postgres inicializar antes de rodar o teste
      run: sleep 5 

    - name: Test
      run: go test -v ./...
      env: # <--- ADICIONE ESTE BLOCO 'env'
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: root
        DB_PORT: "5435" # Porta que o docker-compose expõe para o host
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v main.go

    docker:
        needs: build
        uses: ./.github/workflows/Docker.yml

   
   

      
