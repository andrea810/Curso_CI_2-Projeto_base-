name: Go

on:
  workflow_call:
    # Como é um workflow reutilizável, declaramos os secrets que ele vai receber de quem o chamar
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true
      REGISTRY_URL:
        required: false # Opcional, se for Docker Hub padrão, pode deixar vazio

jobs:
  docker:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker build
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ${{ secrets.REGISTRY_URL }}
          # Username used to log against the Docker registry
          username: ${{ secrets.REGISTRY_USERNAME }}
          # Password or personal access token used to log against the Docker registry
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}
          
          # --- Parâmetros opcionais (descomente e preencha se precisar) ---
          # Specifies whether the given registry is ECR (auto, true or false)
          # ecr: auto 
          # Scope for the authentication token
          # scope: 
          # Log out from the Docker registry at the end of a job
          # logout: true 
          # Raw authentication to registries, defined as YAML objects
          # registry-auth: 

      # --- PASSO ADICIONAL: Construir e Enviar a Imagem ---
      # Seu arquivo original não tinha este passo, mas é ele que efetivamente 
      # lê o seu Dockerfile do Go e envia para o registry.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Pasta onde está o seu Dockerfile (geralmente a raiz)
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/minha-app-go:latest # Ajuste o nome da sua imagem
