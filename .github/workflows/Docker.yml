name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.22', '1.23']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for DB to be ready
      run: sleep 5 

    - name: Test
      run: go test -v ./...
      env:
        DB_HOST: localhost
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: root
        DB_PORT: "5435"
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v .  # Mudei de main.go para . (mais robusto)

  # ✅ AQUI ESTÁ A CORREÇÃO: 'docker' é um JOB, não um step
  docker:
    needs: build  # Só roda se 'build' passar
    uses: ./.github/workflows/Docker.yml  # Chama o workflow reutilizável
    with:
      # Se o seu Docker.yml aceitar inputs, você passa aqui
      # Exemplo: image-name: minha-app-go
    secrets:
      # Passa os secrets que o Docker.yml precisa
      REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      REGISTRY_URL: ${{ secrets.DOCKERHUB_URL }}  # ou deixe vazio para Docker Hub
