name: Docker Build and Push

# OBRIGATÓRIO: Define que este arquivo é um workflow reutilizável
on:
  workflow_call:
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: true
      REGISTRY_URL:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.PASSWORD_DOCKER_HUB }}
         
    - name: Build and push Docker images
  # You may pin to the exact commit or the version.
  # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
    # Builder instance
        context: .
    # Path to the Dockerfile
        file: ./Dockerfile
    # Push is a shorthand for --output=type=registry
        push: true
    # List of tags
        tags: andrea810/go_ci:${{ github.ref_name }}
    # Sets the target stage to build
      
    # GitHub Token used to authenticate against a repository for Git context
        github-token: # optional, default is ${{ github.token }}
